<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><text x="800" y="45" font-family="Arial, sans-serif" font-size="40" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="700">Assignment is separate from claimed execution</text>
<rect x="70" y="125" width="360" height="170" rx="16" fill="#EEF4F7" stroke="#2861A6" stroke-width="3"/>
<text x="250.0" y="163" font-family="Arial, sans-serif" font-size="36" fill="#2861A6" text-anchor="middle" dominant-baseline="middle" font-weight="700">QUEUED</text>
<text x="250.0" y="211" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Accepted in database</text>
<rect x="620" y="125" width="360" height="170" rx="16" fill="#EEF4F7" stroke="#7952AD" stroke-width="3"/>
<text x="800.0" y="163" font-family="Arial, sans-serif" font-size="36" fill="#7952AD" text-anchor="middle" dominant-baseline="middle" font-weight="700">ASSIGNED</text>
<text x="800.0" y="211" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Worker reserved</text>
<text x="800.0" y="249" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">UI label Starting</text>
<rect x="1170" y="125" width="360" height="170" rx="16" fill="#EEF4F7" stroke="#087F70" stroke-width="3"/>
<text x="1350.0" y="163" font-family="Arial, sans-serif" font-size="36" fill="#087F70" text-anchor="middle" dominant-baseline="middle" font-weight="700">RUNNING</text>
<text x="1350.0" y="211" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Agent claimed lease</text>
<polyline points="430,207 620,207" fill="none" stroke="#546675" stroke-width="4" /><polygon points="620,207 603.7919521576518,214.82937961400214 603.7919521576518,199.17062038599786" fill="#546675"/>
<text x="525" y="170" font-family="Arial, sans-serif" font-size="28" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Scheduler</text>
<polyline points="980,207 1170,207" fill="none" stroke="#546675" stroke-width="4" /><polygon points="1170,207 1153.7919521576518,214.82937961400214 1153.7919521576518,199.17062038599786" fill="#546675"/>
<text x="1075" y="170" font-family="Arial, sans-serif" font-size="28" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Agent claim</text>
<rect x="70" y="520" width="360" height="170" rx="16" fill="#EEF4F7" stroke="#546675" stroke-width="3"/>
<text x="250.0" y="558" font-family="Arial, sans-serif" font-size="36" fill="#546675" text-anchor="middle" dominant-baseline="middle" font-weight="700">CANCELLED</text>
<text x="250.0" y="606" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Cancellation outcome</text>
<rect x="620" y="520" width="360" height="170" rx="16" fill="#EEF4F7" stroke="#A04642" stroke-width="3"/>
<text x="800.0" y="558" font-family="Arial, sans-serif" font-size="36" fill="#A04642" text-anchor="middle" dominant-baseline="middle" font-weight="700">FAILED</text>
<text x="800.0" y="606" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Exit error or recovery</text>
<rect x="1170" y="520" width="360" height="170" rx="16" fill="#EEF4F7" stroke="#087F70" stroke-width="3"/>
<text x="1350.0" y="558" font-family="Arial, sans-serif" font-size="36" fill="#087F70" text-anchor="middle" dominant-baseline="middle" font-weight="700">COMPLETED</text>
<text x="1350.0" y="606" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Exit zero no error</text>
<polyline points="250,295 250,520" fill="none" stroke="#546675" stroke-width="4" /><polygon points="250,520 242.17062038599786,503.7919521576518 257.82937961400216,503.7919521576518" fill="#546675"/>
<text x="70" y="410" font-family="Arial, sans-serif" font-size="26" fill="#172B38" text-anchor="start" dominant-baseline="middle" font-weight="400">Early cancel</text>
<polyline points="1350,295 1350,520" fill="none" stroke="#087F70" stroke-width="4" /><polygon points="1350,520 1342.1706203859978,503.7919521576518 1357.8293796140022,503.7919521576518" fill="#087F70"/>
<text x="1380" y="410" font-family="Arial, sans-serif" font-size="27" fill="#087F70" text-anchor="start" dominant-baseline="middle" font-weight="400">Success</text>
<polyline points="1285,295 1285,375 800,375 800,520" fill="none" stroke="#A04642" stroke-width="4" /><polygon points="800,520 792.1706203859978,503.7919521576518 807.8293796140022,503.7919521576518" fill="#A04642"/>
<text x="1010" y="415" font-family="Arial, sans-serif" font-size="28" fill="#A04642" text-anchor="middle" dominant-baseline="middle" font-weight="400">Failure or timeout</text>
<polyline points="1215,295 1215,460 365,460 365,520" fill="none" stroke="#546675" stroke-width="4" /><polygon points="365,520 357.17062038599784,503.7919521576518 372.82937961400216,503.7919521576518" fill="#546675"/>
<text x="250" y="727" font-family="Arial, sans-serif" font-size="24" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Stop confirmed or recovered</text>
<text x="800" y="760" font-family="Arial, sans-serif" font-size="32" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="700">Retry creates a new QUEUED job linked by retry_of</text>
<text x="800" y="805" font-family="Arial, sans-serif" font-size="27" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Cancelling an unclaimed ASSIGNED job can also finish immediately</text></svg>