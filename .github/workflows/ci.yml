name: Nimbus checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus-test-only
          POSTGRES_DB: nimbus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-test-only-signing-secret-with-sufficient-length
      ENVIRONMENT: local
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus-test-only
      POSTGRES_SERVER: localhost
      POSTGRES_DB: nimbus
      REDIS_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts
      - run: mypy app --exclude tests
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
