# Automatically merged with docker-compose.yml by `docker compose up`.
# Switches backend/frontend to their `development` build targets, mounts
# source for hot reload, and adds pgAdmin for local DB inspection.
#
# For a production-like run, use:
#   docker compose -f docker-compose.yml up

services:
  backend:
    build:
      target: development
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  celery-worker:
    build:
      target: development
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      target: development
    volumes:
      - ./backend:/app

  flower:
    build:
      target: development
    volumes:
      - ./backend:/app

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nimbus.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - nimbus-net

volumes:
  pgadmin_data:
