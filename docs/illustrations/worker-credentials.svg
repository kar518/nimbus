<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><text x="800" y="44" font-family="Arial, sans-serif" font-size="40" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="700">Three scopes of worker authority</text>
<rect x="45" y="150" width="465" height="235" rx="16" fill="#EEF4F7" stroke="#2861A6" stroke-width="3"/>
<text x="277.5" y="188" font-family="Arial, sans-serif" font-size="36" fill="#2861A6" text-anchor="middle" dominant-baseline="middle" font-weight="700">Bootstrap token</text>
<text x="277.5" y="236" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Enroll a worker</text>
<text x="277.5" y="274" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Shared registration secret</text>
<polyline points="510,275 563,275" fill="none" stroke="#546675" stroke-width="4" /><polygon points="563,275 546.7919521576518,282.82937961400216 546.7919521576518,267.17062038599784" fill="#546675"/>
<rect x="565" y="150" width="465" height="235" rx="16" fill="#EEF4F7" stroke="#7952AD" stroke-width="3"/>
<text x="797.5" y="188" font-family="Arial, sans-serif" font-size="36" fill="#7952AD" text-anchor="middle" dominant-baseline="middle" font-weight="700">Worker JWT</text>
<text x="797.5" y="236" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Identify worker session</text>
<text x="797.5" y="274" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Expires in 30 days</text>
<polyline points="1030,275 1083,275" fill="none" stroke="#546675" stroke-width="4" /><polygon points="1083,275 1066.7919521576518,282.82937961400216 1066.7919521576518,267.17062038599784" fill="#546675"/>
<rect x="1085" y="150" width="465" height="235" rx="16" fill="#EEF4F7" stroke="#087F70" stroke-width="3"/>
<text x="1317.5" y="188" font-family="Arial, sans-serif" font-size="36" fill="#087F70" text-anchor="middle" dominant-baseline="middle" font-weight="700">Execution lease</text>
<text x="1317.5" y="236" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Identify one assignment</text>
<text x="1317.5" y="274" font-family="Arial, sans-serif" font-size="30" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">UUID checked with worker</text>
<text x="800" y="452" font-family="Arial, sans-serif" font-size="32" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">A user session is a separate credential for people using the workspace</text>
<text x="800" y="518" font-family="Arial, sans-serif" font-size="29" fill="#172B38" text-anchor="middle" dominant-baseline="middle" font-weight="400">Re enrollment rotates session_id and rejects the older worker JWT</text></svg>