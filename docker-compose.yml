name: nimbus

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
  POSTGRES_USER: ${POSTGRES_USER:-nimbus}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus}
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-nimbus}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-nimbus.default}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
  WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-45}
  WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus}
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbus} -d ${POSTGRES_DB:-nimbus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nimbus-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nimbus-net

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - nimbus-net

  celery-worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "nimbus.default,nimbus.scheduling"]
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nimbus-net

  celery-beat:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nimbus-net

  flower:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app",
        "flower",
        "--port=5555",
        "--url_prefix=flower",
      ]
    environment:
      <<: *backend-env
    depends_on:
      - redis
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - nimbus-net

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/api/v1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - nimbus-net

networks:
  nimbus-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
